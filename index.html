<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>oRIlo File Explorer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menu" class="icon mobile">☰</button>
  <a class="brand" href="#"><i>o</i><span><b>oRIlo</b><small>www0abdb-oss File oporu</small></span></a>
  <div class="topRight"><button id="theme" class="icon">◐</button><a class="repo" href="https://github.com/kaderlaib19-alt/m3allKanfor" target="_blank">GitHub ↗</a></div>
</header>

<div class="layout">
<aside id="side">
  <h4>EXPLORER</h4>
  <button class="filter active" data-filter="all">▦ <span>All Files</span></button>
  <button class="filter" data-filter="pdf">📕 <span>PDF</span></button>
  <button class="filter" data-filter="documents">📘 <span>Documents</span></button>
  <button class="filter" data-filter="archives">📦 <span>Archives</span></button>
  <button class="filter" data-filter="images">🖼️ <span>Images</span></button>
  <button class="filter" data-filter="videos">🎬 <span>Videos</span></button>
  <button class="filter" data-filter="audio">🎵 <span>Audio</span></button>
</aside>

<main>
  <div class="crumb">GitHub › kaderlaib19-alt › <b>m3allKanfor</b></div>
  <section class="hero">
    <div><label>LIVE REPOSITORY</label><h1>Your files, organized.</h1><p>Real files from <b>kaderlaib19-alt/m3allKanfor</b>.</p></div>
    <strong class="count" id="count">0 files</strong>
  </section>

  <div class="toolbar">
    <div class="search">⌕<input id="search" placeholder="Search files..."><button id="clear">×</button></div>
    <select id="sort"><option value="name">Name</option><option value="type">Type</option></select>
    <button class="view active" data-view="grid">▦</button>
    <button class="view" data-view="list">☷</button>
  </div>

  <div id="files" class="files grid"></div>
</main>
</div>

<div id="viewer" hidden>
  <div class="viewerTop"><b id="viewerName"></b><div><a id="download" target="_blank">Download</a><button id="close">×</button></div></div>
  <div id="viewerBody"></div>
</div>

<footer>oRIlo File Explorer <span>Source: GitHub / m3allKanfor</span></footer>
<script src="script.js"></script>
</body>
</html>
